name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

4. Click **Commit new file**

---

**3b. Give the Action permission to write**

This step trips up a lot of beginners — don't skip it!

1. Click **Settings** tab (in your repo, not your account)
2. In the left sidebar, click **Actions** → **General**
3. Scroll down to **Workflow permissions**
4. Select **Read and write permissions**
5. Click **Save**

---

**3c. Run it for the first time**

1. Click the **Actions** tab in your repo
2. On the left, click **Generate Snake**
3. Click the grey **Run workflow** dropdown → **Run workflow**
4. Wait about 30 seconds — refresh the page
5. You should see a green ✅ checkmark

